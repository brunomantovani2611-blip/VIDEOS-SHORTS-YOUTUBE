name: Publicar videos automáticamente

on:
  schedule:
    - cron: "17 15 * * *"   # Short  ~ 9:17 México / 12:17 Argentina
    - cron: "43 23 * * *"   # Short  ~ 17:43 México / 20:43 Argentina
    - cron: "7 18 * * 6"    # Video largo cada sábado
  workflow_dispatch:
    inputs:
      format:
        description: "short o long"
        default: "short"
      count:
        description: "Cuántos videos"
        default: "1"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Decidir formato
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "format=${{ inputs.format }}" >> "$GITHUB_OUTPUT"
            echo "count=${{ inputs.count }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 18 * * 6" ]; then
            echo "format=long" >> "$GITHUB_OUTPUT"; echo "count=1" >> "$GITHUB_OUTPUT"
          else
            echo "format=short" >> "$GITHUB_OUTPUT"; echo "count=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Generar y subir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py --format ${{ steps.fmt.outputs.format }} --count ${{ steps.fmt.outputs.count }}
      - name: Guardar historial de temas
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Actualizar historial de videos" && git push)
      - name: Guardar video como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/
          retention-days: 7

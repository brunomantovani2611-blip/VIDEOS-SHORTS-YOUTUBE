# ===== Configuración del canal =====
channel:
  niche: "datos curiosos y misterios de la historia que casi nadie conoce"
  language: "es"              # idioma del guion
  audience: "hispanohablantes de 16 a 40 años"
  tone: "intrigante, rápido, con giros sorprendentes"

# ===== IA (Claude) =====
llm:
  model: "claude-opus-5-5"
  effort: "medium"

# ===== Voz (edge-tts, gratis) =====
# Lista de voces: edge-tts --list-voices | grep es-
voice:
  name: "es-MX-JorgeNeural"
  rate: "+12%"               # un poco más rápido retiene mejor en shorts

# ===== Formatos =====
formats:
  short:
    width: 1080
    height: 1920
    target_seconds: 45       # máx. 60 s para que cuente como Short
  long:
    width: 1920
    height: 1080
    target_seconds: 480      # ~8 min

# ===== Subtítulos =====
subtitles:
  font: "DejaVu Sans"
  words_per_caption: 3
  highlight_color: "&H0000FFFF"   # amarillo (formato ASS BGR)

# ===== Música de fondo (opcional) =====
# Coloca archivos .mp3 libres de derechos en assets/music/
music:
  volume: 0.08

# ===== YouTube =====
youtube:
  category_id: "27"          # 27 = Educación, 24 = Entretenimiento
  privacy: "public"          # public | unlisted | private
  made_for_kids: false
  contains_synthetic_media: true   # obligatorio declarar contenido generado por IA realista
